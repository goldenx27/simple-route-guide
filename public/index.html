<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#17202a"/><title>הדרך של מאור</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{margin:0;background:#f4f6f8;color:#17202a}.app{max-width:480px;min-height:100vh;margin:auto;background:white;padding:22px;box-sizing:border-box}h1{font-size:2rem;margin:12px 0 6px}h2{font-size:1.45rem;margin:6px 0 14px;text-align:center}.card{border-radius:24px;padding:22px;background:#f7f8fa;margin:18px 0;box-shadow:0 5px 20px rgba(0,0,0,.06)}.icon{font-size:4rem;text-align:center}.message{font-size:1.45rem;font-weight:700;line-height:1.4;text-align:center}.sub,.status{text-align:center;opacity:.75;margin-top:8px;line-height:1.5}button{width:100%;border:0;border-radius:18px;padding:18px;font-size:1.25rem;font-weight:800;margin:8px 0;cursor:pointer}.primary{background:#17202a;color:white}.secondary{background:#e9eef3;color:#17202a}.danger{background:#ffe6e6;color:#9c1c1c}.alert{background:#fff1b8;border-radius:18px;padding:18px;font-size:1.35rem;font-weight:800;text-align:center;margin-top:16px}.warning{background:#fff7df;border-radius:16px;padding:14px;font-size:.95rem;line-height:1.5;margin:14px 0}.bus-strip{border-radius:18px;padding:16px;margin:14px 0;background:#eef3f7;display:flex;align-items:center;justify-content:space-between;gap:12px}.bus-strip .main{font-size:1.05rem;font-weight:800}.bus-strip .eta{font-size:1.35rem;font-weight:900;white-space:nowrap}.wake{text-align:center;font-size:.85rem;opacity:.65;margin:8px}.small{font-size:.9rem;opacity:.65}.sim{border-top:1px solid #e8e8e8;margin-top:28px;padding-top:18px}.hidden{display:none}</style></head><body><div class="app"><div id="home"><h1>היי מאור 👋</h1><p>לאן נוסעים?</p><button class="primary" onclick="selectRoute('maor-home-school')">🏫 לבית הספר</button><button class="secondary" onclick="selectRoute('maor-school-home')">🏠 הביתה</button><div id="routePreview" class="warning">בחר מסלול כדי לראות את התחנה וזמן ההגעה של קו 238.</div><div class="bus-strip"><div><div class="main" id="homeBusTitle">🚌 קו 238</div><div class="small" id="homeEtaStatus">בחר מסלול</div></div><div class="eta" id="homeEta">—</div></div><button id="startButton" class="primary hidden" onclick="startTrip()">▶ התחל מסלול</button><button class="danger" onclick="sendHelp()">🆘 צריך עזרה</button></div><div id="trip" class="hidden"><div class="status" id="routeName"></div><div class="bus-strip"><div><div class="main" id="tripBusTitle">🚌 קו 238</div><div class="small" id="tripEtaStatus">מתעדכן אוטומטית</div></div><div class="eta" id="tripEta">—</div></div><div class="wake" id="wakeStatus">מנסה להשאיר את המסך פעיל…</div><div class="card"><div class="icon" id="icon">🚶</div><h2 id="title"></h2><div class="message" id="message"></div><div class="sub" id="sub"></div><div id="alertBox" class="alert hidden"></div></div><button id="busButton" class="primary hidden" onclick="boardBus()">🚌 עליתי לקו 238</button><button class="danger" onclick="sendHelp()">🆘 צריך עזרה</button><div class="sim"><div class="small">מצב סימולציה לפיתוח</div><button class="secondary" onclick="simulateNext()">▶ הדגם את השלב הבא</button><button class="secondary" onclick="useGps()">📍 השתמש ב-GPS אמיתי</button></div></div></div><script>let tripId=null,current=null,wakeLock=null,etaTimer=null,selectedRoute=null;const icons={walk:'🚶',wait_for_bus:'🚏',bus:'🚌',arrival:'🎉'},el=id=>document.getElementById(id);async function api(path,options={}){const res=await fetch(path,{headers:{'Content-Type':'application/json'},...options}),data=await res.json();if(!res.ok)throw new Error(data.detail||'שגיאה');return data}async function selectRoute(id){selectedRoute=id;const d=await api('/api/routes/'+id),i=d.route_info,b=i.boarding_stop,x=i.exit_stop;el('routePreview').textContent=id==='maor-home-school'?`לבית הספר: הבית → ${b.name} (${b.id}) → 7 תחנות → ${x.name} (${x.id}) → רמון דרך שדרת העצים`:`הביתה: רמון → שדרת העצים → מעבר חצייה → ${b.name} (${b.id}) → 7 תחנות → ${x.name} (${x.id}) → הבית`;el('homeBusTitle').textContent=`🚌 קו 238 · תחנה ${b.id}`;el('startButton').classList.remove('hidden');refreshEta()}async function refreshEta(){if(!selectedRoute)return;try{const d=await api('/api/transit/arrival?route_id='+selectedRoute),t=typeof d.eta_minutes==='number'?`${d.eta_minutes} דק׳`:'—',s=d.realtime_connected?`עודכן עכשיו · ${d.stop_name}`:d.message;el('homeEta').textContent=t;el('tripEta').textContent=t;el('homeEtaStatus').textContent=s;el('tripEtaStatus').textContent=s;el('tripBusTitle').textContent=`🚌 קו 238 · תחנה ${d.stop_id}`}catch(e){el('homeEtaStatus').textContent='אין כרגע נתוני זמן אמת'}}function startEtaPolling(){refreshEta();if(etaTimer)clearInterval(etaTimer);etaTimer=setInterval(refreshEta,20000)}async function requestWakeLock(){if(!tripId)return;try{if('wakeLock'in navigator){wakeLock=await navigator.wakeLock.request('screen');el('wakeStatus').textContent='🔆 המסך יישאר פעיל בזמן המסלול'}else el('wakeStatus').textContent='המכשיר לא תומך במניעת כיבוי מסך דרך הדפדפן'}catch(e){el('wakeStatus').textContent='לא הצלחתי למנוע כיבוי מסך'}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tripId&&!wakeLock)requestWakeLock()});async function startTrip(){if(!selectedRoute)return;try{current=await api('/api/trips/start/'+selectedRoute,{method:'POST'});tripId=current.trip.id;el('home').classList.add('hidden');el('trip').classList.remove('hidden');render(current);speak(current.message);await requestWakeLock();startEtaPolling()}catch(e){alert(e.message)}}function render(d){current=d;const s=d.step;el('routeName').textContent=d.route_name;el('icon').textContent=icons[s.type]||'📍';el('title').textContent=s.title;el('message').textContent=d.message||s.instruction;const a=[];if(s.bus_line)a.push(`קו ${s.bus_line}`);if(s.stop_id)a.push(`תחנה ${s.stop_id}`);if(s.address)a.push(s.address);el('sub').textContent=a.join(' · ');const b=el('alertBox');if(d.alert){b.textContent=d.alert;b.classList.remove('hidden');navigator.vibrate?.([250,120,250]);speak(d.alert)}else b.classList.add('hidden');el('busButton').classList.toggle('hidden',s.type!=='wait_for_bus')}function speak(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';speechSynthesis.speak(u)}async function boardBus(){render(await api(`/api/trips/${tripId}/board-bus`,{method:'POST'}))}async function simulateNext(){if(current&&tripId)render(await api(`/api/trips/${tripId}/simulate-next`,{method:'POST'}))}function useGps(){if(tripId)api(`/api/trips/${tripId}/location`,{method:'POST',body:'{}'}).catch(e=>alert(e.message))}async function sendHelp(){if(!tripId){alert('🆘 לאחר שנחבר את צד ההורה, הכפתור ישלח מיקום ויאפשר התקשרות.');return}render(await api(`/api/trips/${tripId}/help`,{method:'POST'}))}</script></body></html>
