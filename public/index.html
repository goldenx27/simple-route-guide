<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#17202a"/><title>הדרך של מאור</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f4f6f8;color:#17202a}body{overflow:hidden}.app{width:min(100%,480px);height:100dvh;margin:auto;background:#fff;padding:14px;overflow:hidden}.screen{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px}.hidden{display:none!important}h1{font-size:1.8rem;margin:0 0 4px}h2{font-size:1.25rem;margin:4px 0 10px;text-align:center}.top{min-height:0}.content{min-height:0;display:flex;flex-direction:column;justify-content:center}.actions{display:grid;gap:8px}.card{border-radius:22px;padding:18px;background:#f7f8fa}.icon{font-size:3.2rem;text-align:center}.message{font-size:1.35rem;font-weight:800;line-height:1.35;text-align:center}.sub,.status{text-align:center;opacity:.72;margin-top:6px;line-height:1.35;font-size:.9rem}button,select,input{font:inherit}button{width:100%;border:0;border-radius:16px;padding:14px;font-size:1.05rem;font-weight:800;cursor:pointer}.primary{background:#17202a;color:#fff}.secondary{background:#e9eef3;color:#17202a}.danger{background:#ffe6e6;color:#9c1c1c}.ghost{background:transparent;color:#52606d;padding:8px}.alert{background:#fff1b8;border-radius:16px;padding:14px;font-size:1.15rem;font-weight:800;text-align:center;margin-top:10px}.warning{background:#fff7df;border-radius:14px;padding:10px;font-size:.85rem;line-height:1.35;margin:8px 0}.bus-strip{border-radius:16px;padding:12px;background:#eef3f7;display:flex;align-items:center;justify-content:space-between;gap:10px}.bus-strip .main{font-size:.95rem;font-weight:800}.bus-strip .eta{font-size:1.25rem;font-weight:900;white-space:nowrap}.small{font-size:.78rem;opacity:.65}.wake{text-align:center;font-size:.75rem;opacity:.65}.route-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.recorder{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}.rec-panel{border-radius:18px;background:#f7f8fa;padding:14px}.rec-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.stat{background:white;border-radius:12px;padding:10px 4px}.stat b{display:block;font-size:1.1rem}.rec-log{min-height:0;overflow:auto;border-radius:16px;background:#fafafa;padding:10px}.rec-row{padding:8px 0;border-bottom:1px solid #e8e8e8;font-size:.85rem}.rec-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}select{width:100%;padding:12px;border:1px solid #d9e0e6;border-radius:12px;background:white}.photo-preview{width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin-top:8px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.photo-grid img{width:100%;height:80px;object-fit:cover;border-radius:10px}.photo-add{margin-top:8px;padding:9px;font-size:.85rem}</style></head><body><div class="app">
<section id="home" class="screen"><div class="top"><h1>היי מאור 👋</h1><div class="route-buttons"><button class="primary" onclick="selectRoute('maor-home-school')">🏫 לבית הספר</button><button class="secondary" onclick="selectRoute('maor-school-home')">🏠 הביתה</button></div><div id="routePreview" class="warning">בחר מסלול כדי לראות את התחנה ואת זמן ההגעה של קו 238.</div></div><div class="content"><div class="bus-strip"><div><div class="main" id="homeBusTitle">🚌 קו 238</div><div class="small" id="homeEtaStatus">בחר מסלול</div></div><div class="eta" id="homeEta">—</div></div></div><div class="actions"><button id="startButton" class="primary hidden" onclick="startTrip()">▶ התחל מסלול</button><button class="danger" onclick="sendHelp()">🆘 צריך עזרה</button><button class="ghost" onclick="openRecorder()">⚙️ מצב הורה — הקלטת מסלול</button></div></section>
<section id="trip" class="screen hidden"><div class="top"><div class="status" id="routeName"></div><div id="tripTransit" class="bus-strip"><div><div class="main" id="tripBusTitle">🚌 קו 238</div><div class="small" id="tripEtaStatus">מתעדכן אוטומטית</div></div><div class="eta" id="tripEta">—</div></div><div class="wake" id="wakeStatus">מנסה להשאיר את המסך פעיל…</div></div><div class="content"><div class="card"><div class="icon" id="icon">🚶</div><h2 id="title"></h2><div class="message" id="message"></div><div class="sub" id="sub"></div><img id="guidePhoto" class="photo-preview hidden" alt="תמונה מהדרך"/><div id="alertBox" class="alert hidden"></div></div></div><div class="actions"><button id="busButton" class="primary hidden" onclick="boardBus()">🚌 עליתי לקו 238</button><button class="secondary" onclick="simulateNext()">▶ הדגם שלב הבא</button><button class="danger" onclick="sendHelp()">🆘 צריך עזרה</button></div></section>
<section id="recorder" class="recorder hidden"><div><h1>הקלטת מסלול 📍</h1><select id="segmentSelect"><option value="home-to-38283">בית → תחנה 38283</option><option value="38252-to-school">תחנה 38252 → רמון</option><option value="school-to-36743">רמון → תחנה 36743</option><option value="33734-to-home">תחנה 33734 → בית</option></select></div><div class="rec-panel"><div class="rec-stats"><div class="stat"><b id="recPoints">0</b><span class="small">נקודות</span></div><div class="stat"><b id="recAccuracy">—</b><span class="small">דיוק GPS</span></div><div class="stat"><b id="recTime">00:00</b><span class="small">זמן</span></div></div><div class="small" id="recStatus" style="margin-top:8px;text-align:center">מוכן להתחלה</div></div><div id="recLog" class="rec-log"><div class="small">סמן נקודות חשובות כמו שדרת העצים או מעבר חצייה. לכל נקודה אפשר לצרף כמה תמונות שתרצה.</div></div><div class="actions"><div class="rec-actions"><button id="recordButton" class="primary" onclick="toggleRecording()">● התחל הקלטה</button><button id="landmarkButton" class="secondary" onclick="addLandmark()" disabled>📌 סמן נקודה</button></div><input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden"/><button id="exportButton" class="secondary" onclick="exportRecording()" disabled>⬇️ שמור קובץ הקלטה</button><button class="ghost" onclick="closeRecorder()">חזרה למסך מאור</button></div></section>
</div><script>
let tripId=null,current=null,wakeLock=null,etaTimer=null,selectedRoute=null;let recWatch=null,recStarted=null,recTimer=null,recPoints=[],recLandmarks=[],pendingLandmark=null;const icons={walk:'🚶',wait_for_bus:'🚏',bus:'🚌',arrival:'🎉'},el=id=>document.getElementById(id);async function api(path,options={}){const res=await fetch(path,{headers:{'Content-Type':'application/json'},...options}),data=await res.json();if(!res.ok)throw new Error(data.detail||'שגיאה');return data}
async function selectRoute(id){selectedRoute=id;const d=await api('/api/routes/'+id),i=d.route_info,b=i.boarding_stop,x=i.exit_stop;el('routePreview').textContent=id==='maor-home-school'?`הבית → ${b.name} (${b.id}) → 7 תחנות → ${x.name} (${x.id}) → רמון`:`רמון → שדרת העצים → מעבר חצייה → ${b.name} (${b.id}) → 7 תחנות → ${x.name} (${x.id}) → הבית`;el('homeBusTitle').textContent=`🚌 קו 238 · תחנה ${b.id}`;el('startButton').classList.remove('hidden');refreshEta()}
async function refreshEta(){if(!selectedRoute)return;try{const d=await api('/api/transit/arrival?route_id='+selectedRoute),t=typeof d.eta_minutes==='number'?`${d.eta_minutes} דק׳`:'—',s=d.realtime_connected?`עודכן עכשיו · ${d.stop_name}`:d.message;el('homeEta').textContent=t;el('tripEta').textContent=t;el('homeEtaStatus').textContent=s;el('tripEtaStatus').textContent=s;el('tripBusTitle').textContent=`🚌 קו 238 · תחנה ${d.stop_id}`}catch(e){el('homeEtaStatus').textContent='אין כרגע נתוני זמן אמת'}}function startEtaPolling(){refreshEta();if(etaTimer)clearInterval(etaTimer);etaTimer=setInterval(refreshEta,20000)}async function requestWakeLock(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(tripId||recWatch)&&!wakeLock)requestWakeLock()});async function startTrip(){if(!selectedRoute)return;current=await api('/api/trips/start/'+selectedRoute,{method:'POST'});tripId=current.trip.id;el('home').classList.add('hidden');el('trip').classList.remove('hidden');render(current);speak(current.message);await requestWakeLock();startEtaPolling()}
function render(d){current=d;const s=d.step;el('routeName').textContent=d.route_name;el('icon').textContent=icons[s.type]||'📍';el('title').textContent=s.title;el('message').textContent=d.message||s.instruction;const a=[];if(s.bus_line)a.push(`קו ${s.bus_line}`);if(s.stop_id)a.push(`תחנה ${s.stop_id}`);if(s.address)a.push(s.address);el('sub').textContent=a.join(' · ');const b=el('alertBox');if(d.alert){b.textContent=d.alert;b.classList.remove('hidden');navigator.vibrate?.([250,120,250]);speak(d.alert)}else b.classList.add('hidden');el('busButton').classList.toggle('hidden',s.type!=='wait_for_bus');el('tripTransit').classList.toggle('hidden',s.type==='bus'||s.type==='arrival'||(s.type==='walk'&&d.trip.current_step>=3))}
function speak(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';speechSynthesis.speak(u)}async function boardBus(){render(await api(`/api/trips/${tripId}/board-bus`,{method:'POST'}))}async function simulateNext(){if(current&&tripId)render(await api(`/api/trips/${tripId}/simulate-next`,{method:'POST'}))}async function sendHelp(){if(!tripId){alert('🆘 לאחר שנחבר את צד ההורה, הכפתור ישלח מיקום ויאפשר התקשרות.');return}render(await api(`/api/trips/${tripId}/help`,{method:'POST'}))}
function openRecorder(){el('home').classList.add('hidden');el('recorder').classList.remove('hidden')}function closeRecorder(){if(recWatch)stopRecording();el('recorder').classList.add('hidden');el('home').classList.remove('hidden')}function toggleRecording(){recWatch?stopRecording():startRecording()}
async function startRecording(){if(!navigator.geolocation){alert('GPS אינו זמין');return}recPoints=[];recLandmarks=[];pendingLandmark=null;recStarted=Date.now();el('recPoints').textContent='0';el('recStatus').textContent='מחפש GPS…';el('landmarkButton').disabled=false;el('exportButton').disabled=true;el('recordButton').textContent='■ סיים הקלטה';await requestWakeLock();recWatch=navigator.geolocation.watchPosition(pos=>{const p={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:Math.round(pos.coords.accuracy),time:new Date().toISOString()};el('recAccuracy').textContent=`±${p.accuracy}מ׳`;el('recStatus').textContent=p.accuracy<=10?'קליטה מצוינת':p.accuracy<=20?'קליטה טובה':'קליטה חלשה — ממשיכים לדגום';const last=recPoints[recPoints.length-1];if(!last||distanceMeters(last,p)>=3){recPoints.push(p);el('recPoints').textContent=String(recPoints.length)}},err=>{el('recStatus').textContent='שגיאת GPS: '+err.message},{enableHighAccuracy:true,maximumAge:0,timeout:15000});recTimer=setInterval(()=>{const s=Math.floor((Date.now()-recStarted)/1000);el('recTime').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}
function stopRecording(){if(recWatch)navigator.geolocation.clearWatch(recWatch);recWatch=null;clearInterval(recTimer);el('recordButton').textContent='● התחל הקלטה';el('landmarkButton').disabled=true;el('exportButton').disabled=recPoints.length===0;el('recStatus').textContent=`ההקלטה הסתיימה · ${recPoints.length} נקודות · ${recLandmarks.length} נקודות ציון`}
function addLandmark(){if(!recWatch||!recPoints.length)return;const name=prompt('שם הנקודה, למשל: שדרת העצים / מעבר החצייה');if(!name)return;const p=recPoints[recPoints.length-1];const lm={name,lat:p.lat,lon:p.lon,accuracy:p.accuracy,time:new Date().toISOString(),photos:[]};recLandmarks.push(lm);pendingLandmark=lm;renderRecLog();if(confirm('לצלם תמונה ראשונה של המקום?'))el('photoInput').click()}
function addPhotoToLandmark(index){pendingLandmark=recLandmarks[index];el('photoInput').click()}
el('photoInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f||!pendingLandmark)return;const r=new FileReader();r.onload=()=>{pendingLandmark.photos.push(r.result);const idx=recLandmarks.indexOf(pendingLandmark);renderRecLog();if(confirm('להוסיף עוד תמונה לאותה נקודה?')){pendingLandmark=recLandmarks[idx];setTimeout(()=>el('photoInput').click(),100)}else pendingLandmark=null};r.readAsDataURL(f);e.target.value=''})
function renderRecLog(){el('recLog').innerHTML=recLandmarks.length?recLandmarks.map((x,i)=>`<div class="rec-row"><b>${i+1}. ${escapeHtml(x.name)}</b><div class="small">דיוק ±${x.accuracy} מ׳ · ${x.photos.length} תמונות</div>${x.photos.length?`<div class="photo-grid">${x.photos.map(p=>`<img src="${p}" alt="${escapeHtml(x.name)}"/>`).join('')}</div>`:''}<button class="secondary photo-add" onclick="addPhotoToLandmark(${i})">📷 הוסף תמונה לנקודה</button></div>`).join(''):'<div class="small">עדיין לא סומנו נקודות חשובות.</div>'}
function exportRecording(){const payload={version:2,segment:el('segmentSelect').value,recorded_at:new Date().toISOString(),points:recPoints,landmarks:recLandmarks};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`simple-route-${payload.segment}-${Date.now()}.json`;a.click();URL.revokeObjectURL(a.href)}function distanceMeters(a,b){const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
