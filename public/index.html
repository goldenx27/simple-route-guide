<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#17202a"/><title>הדרך של מאור</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f4f6f8;color:#17202a}body{overflow:hidden}.app{width:min(100%,480px);height:100dvh;margin:auto;background:#fff;padding:14px;overflow:hidden}.screen{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px}.hidden{display:none!important}h1{font-size:1.8rem;margin:0 0 4px}h2{font-size:1.25rem;margin:4px 0 10px;text-align:center}.top{min-height:0}.content{min-height:0;display:flex;flex-direction:column;justify-content:center;position:relative}.actions{display:grid;gap:8px}.card{border-radius:22px;padding:18px;background:#f7f8fa}.icon{font-size:3.2rem;text-align:center}.message{font-size:1.35rem;font-weight:800;line-height:1.35;text-align:center}.sub,.status{text-align:center;opacity:.72;margin-top:6px;line-height:1.35;font-size:.9rem}button,select,input{font:inherit}button{width:100%;border:0;border-radius:16px;padding:14px;font-size:1.05rem;font-weight:800;cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}.primary{background:#17202a;color:#fff}.secondary{background:#e9eef3;color:#17202a}.danger{background:#ffe6e6;color:#9c1c1c}.ghost{background:transparent;color:#52606d;padding:8px}.alert{background:#fff1b8;border-radius:16px;padding:14px;font-size:1.15rem;font-weight:800;text-align:center;margin-top:10px}.warning{background:#fff7df;border-radius:14px;padding:10px;font-size:.85rem;line-height:1.35;margin:8px 0}.bus-strip{border-radius:16px;padding:12px;background:#eef3f7;display:flex;align-items:center;justify-content:space-between;gap:10px}.bus-strip .main{font-size:.95rem;font-weight:800}.bus-strip .eta{font-size:1.25rem;font-weight:900;white-space:nowrap}.small{font-size:.78rem;opacity:.65}.wake{text-align:center;font-size:.75rem;opacity:.65}.route-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.recorder{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}.rec-panel{border-radius:18px;background:#f7f8fa;padding:14px}.rec-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.stat{background:#fff;border-radius:12px;padding:10px 4px}.stat b{display:block;font-size:1.1rem}.rec-log{min-height:0;overflow:auto;border-radius:16px;background:#fafafa;padding:10px}.rec-row{padding:8px 0;border-bottom:1px solid #e8e8e8;font-size:.85rem}.rec-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}select{width:100%;padding:12px;border:1px solid #d9e0e6;border-radius:12px;background:#fff}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.photo-item{position:relative}.photo-grid img{width:100%;height:80px;object-fit:cover;border-radius:10px}.photo-delete{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;padding:0;font-size:.75rem;background:rgba(255,255,255,.92);color:#9c1c1c}.photo-add,.row-delete{margin-top:8px;padding:9px;font-size:.85rem}.row-actions{display:grid;grid-template-columns:1fr auto;gap:6px}.route-data-tools{display:grid;grid-template-columns:1fr auto;gap:6px}.route-data-state{text-align:center;font-size:.75rem;padding:7px;border-radius:10px;background:#eef3f7;margin-top:7px}.landmark-feedback{position:absolute;left:2px;top:0;width:132px;background:#fff;border:2px solid #b9e7c7;border-radius:18px;padding:7px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:4;text-align:center;animation:feedbackIn .22s ease-out}.landmark-feedback img{width:116px;height:104px;object-fit:cover;border-radius:12px;display:block;margin:auto}.landmark-feedback .ok{font-size:.78rem;font-weight:900;margin-top:5px;color:#18733a;line-height:1.12}.landmark-feedback .where{font-size:.68rem;margin-top:3px;line-height:1.12;color:#52606d}.landmark-dots{display:flex;justify-content:center;gap:4px;margin-top:4px}.landmark-dot{width:6px;height:6px;border-radius:50%;background:#cbd5dc}.landmark-dot.active{background:#18733a}@keyframes feedbackIn{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:380px){.landmark-feedback{width:116px}.landmark-feedback img{width:100px;height:90px}}</style></head><body><div class="app">
<section id="home" class="screen"><div class="top"><h1>היי מאור 👋</h1><div class="route-buttons"><button id="schoolRouteButton" class="secondary" onclick="selectRoute('maor-home-school')">🏫 לבית הספר</button><button id="homeRouteButton" class="secondary" onclick="selectRoute('maor-school-home')">🏠 הביתה</button></div><div id="routePreview" class="warning">בחר מסלול כדי לראות את התחנה ואת זמן ההגעה של קו 238.</div></div><div class="content"><div class="bus-strip"><div><div class="main" id="homeBusTitle">🚌 קו 238</div><div class="small" id="homeEtaStatus">בחר מסלול</div></div><div class="eta" id="homeEta">—</div></div></div><div class="actions"><button id="startButton" class="primary hidden" onclick="startTrip()">▶ התחל מסלול</button><button class="danger" onclick="sendHelp()">🆘 צריך עזרה</button><button class="ghost" onclick="openRecorder()">⚙️ מצב הורה — הקלטת מסלול</button></div></section>
<section id="trip" class="screen hidden"><div class="top"><div class="status" id="routeName"></div><div id="tripTransit" class="bus-strip"><div><div class="main" id="tripBusTitle">🚌 קו 238</div><div class="small" id="tripEtaStatus">מתעדכן אוטומטית</div></div><div class="eta" id="tripEta">—</div></div><div class="wake" id="wakeStatus">מנסה להשאיר את המסך פעיל…</div></div><div class="content"><div id="landmarkFeedback" class="landmark-feedback hidden"><img id="landmarkPhoto" alt="תמונה מהדרך"/><div class="ok">✅ אתה בדרך הנכונה</div><div id="landmarkName" class="where"></div><div id="landmarkDots" class="landmark-dots"></div></div><div class="card"><div class="icon" id="icon">🚶</div><h2 id="title"></h2><div class="message" id="message"></div><div class="sub" id="sub"></div><div id="alertBox" class="alert hidden"></div></div></div><div class="actions"><button id="busButton" class="primary hidden" onclick="boardBus()">🚌 עליתי לקו 238</button><button class="secondary" onclick="simulateNext()">▶ הדגם שלב הבא</button><button class="danger" onclick="sendHelp()">🆘 צריך עזרה</button></div></section>
<section id="recorder" class="recorder hidden"><div><h1>הקלטת מסלול 📍</h1><select id="segmentSelect"><option value="home-to-38283">בית → תחנה 38283</option><option value="38252-to-school">תחנה 38252 → רמון</option><option value="school-to-36743">רמון → תחנה 36743</option><option value="33734-to-home">תחנה 33734 → בית</option></select></div><div class="rec-panel"><div class="rec-stats"><div class="stat"><b id="recPoints">0</b><span class="small">נקודות</span></div><div class="stat"><b id="recAccuracy">—</b><span class="small">דיוק GPS</span></div><div class="stat"><b id="recTime">00:00</b><span class="small">זמן</span></div></div><div class="small" id="recStatus" style="margin-top:8px;text-align:center">מוכן להתחלה</div><div id="routeDataState" class="route-data-state">בודק נתוני מסלול…</div></div><div id="recLog" class="rec-log"><div class="small">התמונות יוקטנו ויידחסו אוטומטית. לכל נקודה אפשר לצרף כמה תמונות.</div></div><div class="actions"><div class="rec-actions"><button id="recordButton" class="primary" onclick="toggleRecording()">● התחל הקלטה</button><button id="landmarkButton" class="secondary" onclick="addLandmark()" disabled>📌 סמן נקודה</button></div><input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden"/><input id="routeFilesInput" type="file" accept="application/json,.json" multiple class="hidden"/><div class="route-data-tools"><button class="secondary" onclick="el('routeFilesInput').click()">📂 טען את 4 ההקלטות</button><button class="danger" onclick="clearSavedRoutes()">🗑️</button></div><button id="exportButton" class="secondary" onclick="exportRecording()" disabled>⬇️ שמור קובץ הקלטה</button><button id="clearRecordingButton" class="danger" onclick="clearRecording()" disabled>🗑️ נקה הקלטה והתחל מחדש</button><button class="ghost" onclick="closeRecorder()">חזרה למסך מאור</button></div></section>
</div><script>
let tripId=null,current=null,wakeLock=null,etaTimer=null,selectedRoute=null,landmarkSlideTimer=null,landmarkSlideIndex=0,currentLandmarkKey=null,gpsWatch=null,gpsAdvanceLock=false,lastAutoAdvanceKey='';let recWatch=null,recStarted=null,recTimer=null,recPoints=[],recLandmarks=[],pendingLandmark=null;const routeRecordings={};const REQUIRED_SEGMENTS=['home-to-38283','38252-to-school','school-to-36743','33734-to-home'];const icons={walk:'🚶',wait_for_bus:'🚏',bus:'🚌',arrival:'🎉'},el=id=>document.getElementById(id);async function api(path,options={}){const res=await fetch(path,{headers:{'Content-Type':'application/json'},...options}),data=await res.json();if(!res.ok)throw new Error(data.detail||'שגיאה');return data}
function openRouteDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('simple-route-guide',1);r.onupgradeneeded=()=>r.result.createObjectStore('routes',{keyPath:'segment'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function saveRouteData(data){const db=await openRouteDb();return new Promise((resolve,reject)=>{const tx=db.transaction('routes','readwrite');tx.objectStore('routes').put(data);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})}async function loadSavedRoutes(){try{const db=await openRouteDb();const rows=await new Promise((resolve,reject)=>{const tx=db.transaction('routes','readonly'),r=tx.objectStore('routes').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close();for(const x of rows)routeRecordings[x.segment]=x;updateRouteDataState()}catch(e){el('routeDataState').textContent='לא הצלחתי לפתוח נתוני מסלול'}}function updateRouteDataState(){const count=REQUIRED_SEGMENTS.filter(x=>routeRecordings[x]).length,photos=Object.values(routeRecordings).reduce((n,x)=>n+(x.landmarks||[]).reduce((m,l)=>m+(l.photos?.length||0),0),0);el('routeDataState').textContent=count===4?`✅ 4/4 מקטעים טעונים · ${photos} תמונות`:`נתוני מסלול: ${count}/4 מקטעים טעונים`}
el('routeFilesInput').addEventListener('change',async e=>{const files=[...(e.target.files||[])];let ok=0;for(const f of files){try{const data=JSON.parse(await f.text());if(!REQUIRED_SEGMENTS.includes(data.segment)||!Array.isArray(data.points)||!Array.isArray(data.landmarks))continue;await saveRouteData(data);routeRecordings[data.segment]=data;ok++}catch(err){}}updateRouteDataState();el('recStatus').textContent=ok?`נשמרו ${ok} הקלטות מסלול במכשיר`:'לא נמצאו קבצי מסלול תקינים';e.target.value=''})
async function clearSavedRoutes(){if(!confirm('למחוק מהמכשיר את ארבע הקלטות המסלול והתמונות?'))return;const db=await openRouteDb();await new Promise((resolve,reject)=>{const tx=db.transaction('routes','readwrite');tx.objectStore('routes').clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();for(const k of Object.keys(routeRecordings))delete routeRecordings[k];updateRouteDataState();renderLandmarkFeedback(null)}
function paintRouteButtons(){const school=el('schoolRouteButton'),home=el('homeRouteButton');school.className=selectedRoute==='maor-home-school'?'primary':'secondary';home.className=selectedRoute==='maor-school-home'?'primary':'secondary'}function setRecordingControls(state){const recording=state==='recording',finished=state==='finished';el('landmarkButton').disabled=!recording;el('exportButton').disabled=!finished||recPoints.length===0;el('clearRecordingButton').disabled=!finished;el('segmentSelect').disabled=recording}
async function selectRoute(id){selectedRoute=id;paintRouteButtons();const d=await api('/api/routes/'+id),i=d.route_info,b=i.boarding_stop,x=i.exit_stop;el('routePreview').textContent=id==='maor-home-school'?`הבית → ${b.name} (${b.id}) → 7 תחנות → ${x.name} (${x.id}) → רמון`:`רמון → שדרת העצים → מעבר חצייה → ${b.name} (${b.id}) → 7 תחנות → ${x.name} (${x.id}) → הבית`;el('homeBusTitle').textContent=`🚌 קו 238 · תחנה ${b.id}`;el('startButton').classList.remove('hidden');refreshEta()}
async function refreshEta(){if(!selectedRoute)return;try{const d=await api('/api/transit/arrival?route_id='+selectedRoute),t=typeof d.eta_minutes==='number'?`${d.eta_minutes} דק׳`:'—',s=d.realtime_connected?`עודכן עכשיו · ${d.stop_name}`:d.message;el('homeEta').textContent=t;el('tripEta').textContent=t;el('homeEtaStatus').textContent=s;el('tripEtaStatus').textContent=s;el('tripBusTitle').textContent=`🚌 קו 238 · תחנה ${d.stop_id}`}catch(e){el('homeEtaStatus').textContent='אין כרגע נתוני זמן אמת'}}function startEtaPolling(){refreshEta();if(etaTimer)clearInterval(etaTimer);etaTimer=setInterval(refreshEta,20000)}async function requestWakeLock(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(tripId||recWatch)&&!wakeLock)requestWakeLock()});async function startTrip(){if(!selectedRoute)return;current=await api('/api/trips/start/'+selectedRoute,{method:'POST'});tripId=current.trip.id;el('home').classList.add('hidden');el('trip').classList.remove('hidden');render(current);speak(current.message);await requestWakeLock();startEtaPolling();startGpsGuidance()}
function render(d){current=d;const s=d.step;el('routeName').textContent=d.route_name;el('icon').textContent=icons[s.type]||'📍';el('title').textContent=s.title;el('message').textContent=d.message||s.instruction;const a=[];if(s.bus_line)a.push(`קו ${s.bus_line}`);if(s.stop_id)a.push(`תחנה ${s.stop_id}`);if(s.address)a.push(s.address);el('sub').textContent=a.join(' · ');const b=el('alertBox');if(d.alert){b.textContent=d.alert;b.classList.remove('hidden');navigator.vibrate?.([250,120,250]);speak(d.alert)}else b.classList.add('hidden');el('busButton').classList.toggle('hidden',s.type!=='wait_for_bus');el('tripTransit').classList.toggle('hidden',s.type==='bus'||s.type==='arrival'||(s.type==='walk'&&((selectedRoute==='maor-home-school'&&d.trip.current_step>=3)||(selectedRoute==='maor-school-home'&&d.trip.current_step>=2))));if(s.type!=='walk')renderLandmarkFeedback(null)}
function renderLandmarkFeedback(f){const box=el('landmarkFeedback');if(!f||!Array.isArray(f.photos)||!f.photos.length){box.classList.add('hidden');currentLandmarkKey=null;if(landmarkSlideTimer){clearInterval(landmarkSlideTimer);landmarkSlideTimer=null}return}const key=`${f.name||''}:${f.lat||''}:${f.lon||''}`;if(key!==currentLandmarkKey){currentLandmarkKey=key;landmarkSlideIndex=0;if(landmarkSlideTimer)clearInterval(landmarkSlideTimer);if(f.photos.length>1)landmarkSlideTimer=setInterval(()=>{landmarkSlideIndex=(landmarkSlideIndex+1)%f.photos.length;paintLandmark(f)},3500)}paintLandmark(f);box.classList.remove('hidden')}function paintLandmark(f){el('landmarkPhoto').src=f.photos[landmarkSlideIndex];el('landmarkName').textContent=f.name||'המקום שסימנתם';el('landmarkDots').innerHTML=f.photos.length>1?f.photos.map((_,i)=>`<span class="landmark-dot ${i===landmarkSlideIndex?'active':''}"></span>`).join(''):''}
function segmentForCurrentStep(){if(!current)return null;const s=current.trip.current_step;if(selectedRoute==='maor-home-school'){if(s<=2)return'home-to-38283';if(s===5)return'38252-to-school'}if(selectedRoute==='maor-school-home'){if(s<=1)return'school-to-36743';if(s===4)return'33734-to-home'}return null}function autoTargetForCurrentStep(){if(!current)return null;const s=current.trip.current_step;if(selectedRoute==='maor-home-school')return({0:'שטמפפר',1:'הגענו למכבים',2:'הגענו לתחנה',5:'בית ספר רמון'})[s]||null;if(selectedRoute==='maor-school-home')return({0:'סיום שדרת העצים',1:'תחנה',4:'מעבר לרב אורבך 13'})[s]||null;return null}
function startGpsGuidance(){if(gpsWatch){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}if(!navigator.geolocation)return;gpsWatch=navigator.geolocation.watchPosition(evaluateGpsGuidance,()=>{},{enableHighAccuracy:true,maximumAge:1500,timeout:15000})}async function evaluateGpsGuidance(pos){if(!current||current.step?.type!=='walk')return renderLandmarkFeedback(null);const segment=segmentForCurrentStep(),rec=segment&&routeRecordings[segment];if(!rec)return;const here={lat:pos.coords.latitude,lon:pos.coords.longitude};let best=null,bestDistance=Infinity;for(const lm of rec.landmarks||[]){const d=distanceMeters(here,lm);if(d<bestDistance){best=lm;bestDistance=d}}const threshold=Math.max(16,Math.min(34,(pos.coords.accuracy||12)+8));if(best&&bestDistance<=threshold)renderLandmarkFeedback({...best,distance_m:Math.round(bestDistance)});else renderLandmarkFeedback(null);const target=autoTargetForCurrentStep();if(!target||gpsAdvanceLock)return;const targetLm=(rec.landmarks||[]).find(x=>(x.name||'').includes(target));if(!targetLm)return;const td=distanceMeters(here,targetLm),key=`${selectedRoute}:${current.trip.current_step}:${target}`;if(td<=threshold&&lastAutoAdvanceKey!==key){gpsAdvanceLock=true;lastAutoAdvanceKey=key;navigator.vibrate?.(120);try{await simulateNext()}finally{setTimeout(()=>gpsAdvanceLock=false,2500)}}}
function speak(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();const spoken=t.replace(/שטמפפר/g,'Shtampeper');const u=new SpeechSynthesisUtterance(spoken);u.lang='he-IL';speechSynthesis.speak(u)}async function boardBus(){const d=await api(`/api/trips/${tripId}/board-bus`,{method:'POST'});render(d);speak(d.message||d.step?.instruction)}async function simulateNext(){if(!current||!tripId)return;const d=await api(`/api/trips/${tripId}/simulate-next`,{method:'POST'});render(d);if(!d.alert)speak(d.message||d.step?.instruction);return d}async function sendHelp(){if(!tripId){alert('🆘 לאחר שנחבר את צד ההורה, הכפתור ישלח מיקום ויאפשר התקשרות.');return}render(await api(`/api/trips/${tripId}/help`,{method:'POST'}))}
function openRecorder(){if(selectedRoute==='maor-school-home')el('segmentSelect').value='school-to-36743';else if(selectedRoute==='maor-home-school')el('segmentSelect').value='home-to-38283';el('home').classList.add('hidden');el('recorder').classList.remove('hidden');updateRouteDataState();setRecordingControls(recWatch?'recording':(recPoints.length?'finished':'idle'))}function closeRecorder(){if(recWatch)stopRecording();el('recorder').classList.add('hidden');el('home').classList.remove('hidden')}function toggleRecording(){recWatch?stopRecording():startRecording()}
async function startRecording(){if(!navigator.geolocation){alert('GPS אינו זמין');return}recPoints=[];recLandmarks=[];pendingLandmark=null;recStarted=Date.now();el('recPoints').textContent='0';el('recStatus').textContent='מחפש GPS…';el('recordButton').textContent='■ סיים הקלטה';setRecordingControls('recording');await requestWakeLock();recWatch=navigator.geolocation.watchPosition(pos=>{const p={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:Math.round(pos.coords.accuracy),time:new Date().toISOString()};el('recAccuracy').textContent=`±${p.accuracy}מ׳`;el('recStatus').textContent=p.accuracy<=10?'קליטה מצוינת':p.accuracy<=20?'קליטה טובה':'קליטה חלשה — ממשיכים לדגום';const last=recPoints[recPoints.length-1];if(!last||distanceMeters(last,p)>=3){recPoints.push(p);el('recPoints').textContent=String(recPoints.length)}},err=>{el('recStatus').textContent='שגיאת GPS: '+err.message},{enableHighAccuracy:true,maximumAge:0,timeout:15000});recTimer=setInterval(()=>{const s=Math.floor((Date.now()-recStarted)/1000);el('recTime').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}function stopRecording(){if(recWatch)navigator.geolocation.clearWatch(recWatch);recWatch=null;clearInterval(recTimer);el('recordButton').textContent='● התחל הקלטה';setRecordingControls('finished');el('recStatus').textContent=`ההקלטה הסתיימה · ${recPoints.length} נקודות · ${recLandmarks.length} נקודות ציון`}function clearRecording(){if(recWatch)return;if(!confirm('למחוק את כל ההקלטה, נקודות הציון והתמונות?'))return;recPoints=[];recLandmarks=[];pendingLandmark=null;el('recPoints').textContent='0';el('recAccuracy').textContent='—';el('recTime').textContent='00:00';el('recStatus').textContent='ההקלטה נוקתה';renderRecLog();setRecordingControls('idle')}
function addLandmark(){if(!recWatch||!recPoints.length)return;const name=prompt('שם הנקודה, למשל: שדרת העצים / מעבר החצייה');if(!name)return;const p=recPoints[recPoints.length-1];recLandmarks.push({name,lat:p.lat,lon:p.lon,accuracy:p.accuracy,time:new Date().toISOString(),photos:[]});pendingLandmark=null;renderRecLog();el('recStatus').textContent=`📌 הנקודה “${name}” נשמרה. אפשר להוסיף תמונות מהרשימה למטה.`}function addPhotoToLandmark(index){pendingLandmark=recLandmarks[index];el('photoInput').click()}function deleteLandmark(index){if(!confirm('למחוק את נקודת הציון וכל התמונות שלה?'))return;recLandmarks.splice(index,1);pendingLandmark=null;renderRecLog()}function deletePhoto(li,pi){recLandmarks[li].photos.splice(pi,1);renderRecLog()}
async function compressImage(file){const bitmap=await createImageBitmap(file),max=960,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height)),w=Math.max(1,Math.round(bitmap.width*scale)),h=Math.max(1,Math.round(bitmap.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(bitmap,0,0,w,h);bitmap.close?.();let quality=.72,data=canvas.toDataURL('image/jpeg',quality);while(data.length>240000&&quality>.45){quality-=.08;data=canvas.toDataURL('image/jpeg',quality)}return data}el('photoInput').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f||!pendingLandmark)return;try{el('recStatus').textContent='מקטין ודוחס תמונה…';const compressed=await compressImage(f);pendingLandmark.photos.push(compressed);el('recStatus').textContent=`התמונה נשמרה · בערך ${Math.round(compressed.length*.75/1024)}KB`;renderRecLog();pendingLandmark=null}catch(err){alert('לא הצלחתי לעבד את התמונה');pendingLandmark=null}e.target.value=''})
function renderRecLog(){el('recLog').innerHTML=recLandmarks.length?recLandmarks.map((x,i)=>`<div class="rec-row"><b>${i+1}. ${escapeHtml(x.name)}</b><div class="small">דיוק ±${x.accuracy} מ׳ · ${x.photos.length} תמונות</div>${x.photos.length?`<div class="photo-grid">${x.photos.map((p,j)=>`<div class="photo-item"><img src="${p}" alt="${escapeHtml(x.name)}"/><button class="photo-delete" onclick="deletePhoto(${i},${j})">✕</button></div>`).join('')}</div>`:''}<div class="row-actions"><button class="secondary photo-add" onclick="addPhotoToLandmark(${i})">📷 הוסף תמונה</button><button class="danger row-delete" onclick="deleteLandmark(${i})">🗑️</button></div></div>`).join(''):'<div class="small">עדיין לא סומנו נקודות חשובות.</div>'}function exportRecording(){const payload={version:3,image_policy:{max_dimension:960,format:'jpeg',quality:'adaptive'},segment:el('segmentSelect').value,recorded_at:new Date().toISOString(),points:recPoints,landmarks:recLandmarks};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`simple-route-${payload.segment}-${Date.now()}.json`;a.click();URL.revokeObjectURL(a.href)}function distanceMeters(a,b){const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
loadSavedRoutes();paintRouteButtons();setRecordingControls('idle');
</script></body></html>
