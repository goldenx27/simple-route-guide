<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>הדרך של מאור</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
    body { margin:0; background:#f4f6f8; color:#17202a; }
    .app { max-width:480px; min-height:100vh; margin:auto; background:white; padding:22px; box-sizing:border-box; }
    h1 { font-size:2rem; margin:12px 0 6px; } h2 { font-size:1.45rem; margin:6px 0 14px; }
    .card { border-radius:24px; padding:22px; background:#f7f8fa; margin:18px 0; box-shadow:0 5px 20px rgba(0,0,0,.06); }
    .icon { font-size:4rem; text-align:center; } .message { font-size:1.45rem; font-weight:700; line-height:1.4; text-align:center; }
    .sub,.status { text-align:center; opacity:.7; margin-top:8px; }
    button { width:100%; border:0; border-radius:18px; padding:18px; font-size:1.25rem; font-weight:800; margin:8px 0; cursor:pointer; }
    .primary { background:#17202a; color:white; } .secondary { background:#e9eef3; color:#17202a; } .danger { background:#ffe6e6; color:#9c1c1c; }
    .alert { background:#fff1b8; border-radius:18px; padding:18px; font-size:1.35rem; font-weight:800; text-align:center; margin-top:16px; }
    .small { font-size:.9rem; opacity:.65; } .sim { border-top:1px solid #e8e8e8; margin-top:28px; padding-top:18px; } .hidden { display:none; }
  </style>
</head>
<body><div class="app">
<div id="home"><h1>בוקר טוב מאור 👋</h1><p>לאן נוסעים?</p><button class="primary" onclick="startTrip()">🏫 לבית הספר</button><button class="secondary" disabled>🏠 הביתה — בקרוב</button><button class="danger" onclick="sendHelp()">🆘 צריך עזרה</button></div>
<div id="trip" class="hidden"><div class="status" id="routeName"></div><div class="card"><div class="icon" id="icon">🚶</div><h2 id="title"></h2><div class="message" id="message"></div><div class="sub" id="sub"></div><div id="alertBox" class="alert hidden"></div></div><button id="busButton" class="primary hidden" onclick="boardBus()">🚌 עליתי לאוטובוס</button><button class="danger" onclick="sendHelp()">🆘 צריך עזרה</button><div class="sim"><div class="small">מצב סימולציה לפיתוח</div><button class="secondary" onclick="simulateNext()">▶ הדגם את השלב הבא</button><button class="secondary" onclick="useGps()">📍 השתמש ב-GPS אמיתי</button></div></div>
</div><script>
let tripId=null,current=null,simulatedBusStops=6;const icons={walk:'🚶',wait_for_bus:'🚏',bus:'🚌',arrival:'🎉'};
const el=id=>document.getElementById(id);
async function api(path,options={}){const res=await fetch(path,{headers:{'Content-Type':'application/json'},...options});const data=await res.json();if(!res.ok)throw new Error(data.detail||'שגיאה');return data;}
async function startTrip(){current=await api('/api/trips/start/maor-home-school',{method:'POST'});tripId=current.trip.id;el('home').classList.add('hidden');el('trip').classList.remove('hidden');render(current);speak(current.message);}
function render(data){current=data;const step=data.step;el('routeName').textContent=data.route_name;el('icon').textContent=icons[step.type]||'📍';el('title').textContent=step.title;el('message').textContent=data.message||step.instruction;el('sub').textContent=step.bus_line?`קו ${step.bus_line}`:'';const box=el('alertBox');if(data.alert){box.textContent=data.alert;box.classList.remove('hidden');navigator.vibrate?.([250,120,250]);speak(data.alert)}else box.classList.add('hidden');el('busButton').classList.toggle('hidden',step.type!=='wait_for_bus');}
function speak(text){if(!text||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='he-IL';speechSynthesis.speak(u);}
async function boardBus(){simulatedBusStops=6;render(await api(`/api/trips/${tripId}/board-bus`,{method:'POST',body:JSON.stringify({remaining_stops:simulatedBusStops})}));}
async function simulateNext(){if(!current||!tripId)return;const type=current.step.type;if(type==='walk'){const points=current.step.instruction_points||[],idx=current.trip.current_instruction_index||0;const target=idx<points.length?points[idx].location:current.step.destination.location;render(await api(`/api/trips/${tripId}/location`,{method:'POST',body:JSON.stringify(target)}));return}if(type==='wait_for_bus'){await boardBus();return}if(type==='bus'){simulatedBusStops=Math.max(0,simulatedBusStops-1);render(await api(`/api/trips/${tripId}/bus-progress`,{method:'POST',body:JSON.stringify({remaining_stops:simulatedBusStops})}));}}
function useGps(){if(!navigator.geolocation)return window.alert('GPS אינו זמין בדפדפן הזה');navigator.geolocation.watchPosition(async pos=>{if(!tripId)return;try{render(await api(`/api/trips/${tripId}/location`,{method:'POST',body:JSON.stringify({lat:pos.coords.latitude,lon:pos.coords.longitude})}))}catch(e){console.error(e)}},err=>window.alert('לא ניתן לקבל מיקום: '+err.message),{enableHighAccuracy:true,maximumAge:3000,timeout:10000});}
async function sendHelp(){if(!tripId){window.alert('🆘 במוצר האמיתי כאן תהיה התקשרות/שליחת מיקום להורה.');return}render(await api(`/api/trips/${tripId}/help`,{method:'POST'}));}
</script></body></html>
