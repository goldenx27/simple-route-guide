name: Update official GTFS schedule

on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-official-gtfs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract line 238 from the Ministry feed
        run: python scripts/update_gtfs.py --days 10
      - name: Commit changed schedule
        run: |
          if git diff --quiet -- public/data/gtfs-238.json; then exit 0; fi
          git config user.name "simple-route-guide bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- public/data/gtfs-238.json
          git commit -m "chore: update official GTFS schedule"
          git push

